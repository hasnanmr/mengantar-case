[project]
name = "acne-care-chatbot-backend"
version = "0.1.0"
description = "AI Sales Chatbot Backend for Acne Care Cream"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "faiss-cpu>=1.8.0",
    "transformers>=4.45.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
    "sse-starlette>=2.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "torch>=2.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
