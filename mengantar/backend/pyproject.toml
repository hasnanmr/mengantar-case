[project]
name = "acne-care-chatbot-backend"
version = "0.1.0"
description = "AI Sales Chatbot Backend for Acne Care Cream"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn==0.38.0",
    "pydantic-settings==2.12.0",
    "pydantic-core==2.41.5",
    "langgraph==1.0.3",
    "langgraph-api>=0.5.16",
    "langgraph-checkpoint==3.0.1",
    "langgraph-cli>=0.4.7",
    "langgraph-prebuilt==1.0.4",
    "langgraph-runtime-inmem==0.18.0",
    "langgraph-sdk==0.2.9",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "faiss-cpu>=1.8.0",
    "transformers>=4.45.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
    "sse-starlette>=2.1.0",
    "psycopg[binary,pool]>=3.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "torch>=2.0.0",
    "langfuse==3.11.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
