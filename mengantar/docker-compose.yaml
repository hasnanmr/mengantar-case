services:
  postgres:
    image: postgres:17-alpine
    container_name: mengantar-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acne-care-backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.hasnan.cloud
    container_name: acne-care-frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://api.hasnan.cloud
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mengantar-cloudflared
    command: tunnel --no-autoupdate run --token eyJhIjoiNzRhZjE3N2QzOTBkZjM5ZmI5ZTVmMTgwY2MzYmZjNmYiLCJ0IjoiNmE5NzYxZGEtMTJjMi00MTQ2LWIxYmItMTZjOGQ0OTc2ZWUwIiwicyI6IlkyRTNZbVl6WVRZdE5UUXlaaTAwTW1ZMUxUbG1NR0l0WXpWbU9ERmhOakl4WldJMCJ9
    restart: unless-stopped
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
    name: mengantar-postgres-data
  backend-data:
    name: acne-care-backend-data
